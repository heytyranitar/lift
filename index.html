<style>
:root{
  --bg:#EEF0EC;--surface:#FFFFFF;--ink:#1B1F23;--muted:#6B727A;--line:#D9DCD6;
  --accent:#2457D6;--accent-ink:#FFFFFF;--ok:#1F8A5B;--miss:#C2492F;--soft:#E4E7E1;
  --head:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121519;--surface:#1B2026;--ink:#E8EAE6;--muted:#97A0A9;--line:#2B323A;
    --accent:#6C93FF;--accent-ink:#0B1020;--ok:#4CC38A;--miss:#F0805F;--soft:#252B33;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121519;--surface:#1B2026;--ink:#E8EAE6;--muted:#97A0A9;--line:#2B323A;
  --accent:#6C93FF;--accent-ink:#0B1020;--ok:#4CC38A;--miss:#F0805F;--soft:#252B33;color-scheme:dark;
}
/* Sukuna (Jujutsu Kaisen): black, bone and blood red, paired stripes after his markings */
:root[data-theme="sukuna"]{
  --bg:#0D0A0B;--surface:#171113;--ink:#EEE6DA;--muted:#A0928A;--line:#3A2427;
  --accent:#DA3340;--accent-ink:#F7F0E6;--ok:#A8192A;--ok-ink:#F7F0E6;--miss:#4A4245;--soft:#241A1C;color-scheme:dark;
  --head:"Shippori Mincho B1","Barlow Condensed",Georgia,serif;
}
:root[data-theme="sukuna"] body{background:
  radial-gradient(1.5px 1.5px at 31px 57px,rgba(255,90,70,.6),transparent),radial-gradient(1px 1px at 143px 121px,rgba(255,140,90,.5),transparent),
  radial-gradient(2px 2px at 97px 173px,rgba(218,51,64,.5),transparent),radial-gradient(1px 1px at 181px 23px,rgba(255,110,80,.45),transparent);
  background-size:210px 210px;background-color:var(--bg);background-attachment:fixed}
:root[data-theme="sukuna"] body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;

:root[data-theme="sukuna"] body::before{content:"\546A";position:fixed;right:-18px;bottom:44px;font:800 230px/1 var(--head);color:#DA3340;opacity:.05;pointer-events:none;z-index:-1}
:root[data-theme="sukuna"] h1::after{content:"";display:block;width:34px;height:9px;margin-top:9px;background:linear-gradient(var(--accent) 0 3px,transparent 3px 6px,var(--accent) 6px);filter:drop-shadow(0 0 4px rgba(218,51,64,.8))}

:root[data-theme="sukuna"] .card::before{content:"";position:absolute;left:-1px;top:16px;width:3px;height:20px;background:linear-gradient(var(--accent) 0 8px,transparent 8px 12px,var(--accent) 12px);filter:drop-shadow(0 0 3px rgba(218,51,64,.9))}
:root[data-theme="sukuna"] .tab.on{box-shadow:inset 0 2px 0 var(--accent),inset 0 5px 0 var(--surface),inset 0 7px 0 var(--accent),0 -8px 16px -10px rgba(218,51,64,.9)}
:root[data-theme="sukuna"] .set.done{background:radial-gradient(circle at 50% 38%,#E3434F,#8E1020 72%);border-color:#E3434F;box-shadow:0 0 12px rgba(218,51,64,.45)}

:root[data-theme="sukuna"] .set.miss{border-color:var(--accent);color:var(--ink)}
:root[data-theme="sukuna"] .btn.danger,:root[data-theme="sukuna"] .trend{color:#EC5A65}
:root[data-theme="sukuna"] #rest{background:#160E10;color:var(--ink);border:1px solid var(--accent);box-shadow:0 0 18px rgba(218,51,64,.3)}
:root[data-theme="sukuna"] #rest .btn{color:var(--ink);border-color:rgba(218,51,64,.5)}

:root[data-theme="gojo"] h1{letter-spacing:.5px}

:root[data-theme="gojo"] .btn.primary{box-shadow:0 0 14px rgba(92,200,255,.35)}
:root[data-theme="gojo"] .btn.danger,:root[data-theme="gojo"] .trend{color:#B9A3FF}
:root[data-theme="gojo"] #rest{background:#0A101E;color:var(--ink);border:1px solid var(--accent);box-shadow:0 0 18px rgba(92,200,255,.3)}

  repeating-radial-gradient(circle at 88% 7%,transparent 0 62px,rgba(212,31,48,.09) 62px 63px,transparent 63px 88px);

:root[data-theme="itachi"] .card{background:rgba(20,20,24,.82);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
:root[data-theme="itachi"] .tab.on{box-shadow:inset 0 2px 0 var(--accent),0 -8px 16px -10px rgba(212,31,48,.9)}
:root[data-theme="itachi"] .btn.primary{background:linear-gradient(180deg,#E0303F,#A8121F);border-color:#E0303F;box-shadow:0 0 14px rgba(212,31,48,.35)}
:root[data-theme="itachi"] body::before{content:"\6731";position:fixed;right:-14px;bottom:44px;font:700 230px/1 var(--head);color:#D41F30;opacity:.05;pointer-events:none;z-index:-1}
:root[data-theme="itachi"] h1::after{content:"";display:block;width:86px;height:20px;margin-top:8px;filter:drop-shadow(0 0 4px rgba(212,31,48,.7));background:
  radial-gradient(circle at 10px 4.5px,#0B0B0E 1.9px,transparent 2.3px),radial-gradient(circle at 5.25px 12.75px,#0B0B0E 1.9px,transparent 2.3px),radial-gradient(circle at 14.75px 12.75px,#0B0B0E 1.9px,transparent 2.3px),
  radial-gradient(circle at 10px 10px,transparent 4.6px,rgba(0,0,0,.55) 5px 5.9px,transparent 6.3px),
  radial-gradient(circle at 10px 10px,#E8323F 0 7.9px,#8E0F1A 8.5px 9.8px,transparent 10.2px),
  linear-gradient(90deg,var(--accent),transparent) 27px 9.25px/59px 1.5px no-repeat}
:root[data-theme="itachi"] .set.done{border-color:#E8323F;box-shadow:0 0 12px rgba(212,31,48,.45);
  background:radial-gradient(circle closest-side,transparent 0 calc(100% - 10px),rgba(0,0,0,.5) calc(100% - 10px) calc(100% - 8.5px),transparent calc(100% - 8.5px)),radial-gradient(circle at 50% 40%,#E8323F,#9E0F1B 72%)}
:root[data-theme="itachi"] .btn.danger,:root[data-theme="itachi"] .trend{color:#F0606B}
:root[data-theme="itachi"] #rest{background:#141418;color:var(--ink);border:1px solid var(--accent);box-shadow:0 0 18px rgba(212,31,48,.3)}
:root[data-theme="itachi"] #rest .btn{color:var(--ink);border-color:rgba(212,31,48,.5)}
/* Ultra Instinct (Dragon Ball Super): black and chrome, silver aura, a faint violet tint */
:root[data-theme="ultra"]{
  --bg:#08080B;--surface:#121216;--ink:#F1F2F5;--muted:#9A9CA6;--line:#2A2A31;
  --accent:#D9DCE3;--accent-ink:#0B0B0F;--ok:#C5C9D2;--ok-ink:#0B0B0F;--miss:#5A4E78;--soft:#1C1C22;color-scheme:dark;
  --head:"Chakra Petch","Barlow Condensed",system-ui,sans-serif;
}
:root[data-theme="ultra"] body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:
  radial-gradient(9% 70% at 6% 100%,rgba(225,230,245,.16),transparent 72%),radial-gradient(16% 85% at 30% 104%,rgba(215,220,240,.13),transparent 70%),
  radial-gradient(11% 75% at 54% 102%,rgba(240,242,252,.15),transparent 70%),radial-gradient(17% 90% at 78% 105%,rgba(195,185,235,.14),transparent 70%),
  radial-gradient(9% 65% at 97% 100%,rgba(225,230,245,.16),transparent 72%),radial-gradient(120% 55% at 50% 118%,rgba(110,100,165,.2),transparent 70%)}
:root[data-theme="ultra"] h1{letter-spacing:.5px}
:root[data-theme="ultra"] h1::after{content:"";display:block;width:70px;height:2px;margin-top:10px;background:linear-gradient(90deg,#fff,#C9CDD6 45%,transparent);box-shadow:0 0 8px rgba(255,255,255,.55)}
:root[data-theme="ultra"] .card{background:rgba(18,18,22,.8);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
:root[data-theme="ultra"] .tab.on{box-shadow:inset 0 2px 0 var(--accent),0 -8px 16px -10px rgba(230,234,245,.8)}
:root[data-theme="ultra"] .set.done{background:radial-gradient(circle at 50% 32%,#FFFFFF,#CDD1D9 45%,#8C909A 88%);border-color:#E6E8EE;box-shadow:0 0 12px rgba(220,225,240,.35)}
:root[data-theme="ultra"] .set.miss{color:#fff}
:root[data-theme="ultra"] .btn.primary{background:linear-gradient(180deg,#F4F5F8,#AEB2BC);border-color:#E6E8EE;box-shadow:0 0 14px rgba(220,225,240,.25)}
:root[data-theme="ultra"] .btn.danger,:root[data-theme="ultra"] .trend{color:#BBA9F2}
:root[data-theme="ultra"] #rest{background:#111115;color:var(--ink);border:1px solid var(--accent);box-shadow:0 0 18px rgba(220,225,240,.2)}
:root[data-theme="ultra"] #rest .btn{color:var(--ink);border-color:rgba(217,220,227,.4)}
/* Todoroki (My Hero Academia): half-cold half-hot, flame on the left, ice on the right */
:root[data-theme="todoroki"]{
  --bg:#0B0E15;--surface:#141821;--ink:#F2F3F5;--muted:#9AA1AE;--line:#2A303C;
  --accent:#F2F3F5;--accent-ink:#0B0D12;--ok:#E0402F;--ok-ink:#0B0D12;--miss:#3A404C;--soft:#1D222D;color-scheme:dark;
  --head:"Kanit","Barlow Condensed",system-ui,sans-serif;
  --fire:#E0402F;--ice:#A6DCF3;
}
:root[data-theme="todoroki"] body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:
  radial-gradient(55% 70% at -8% 60%,rgba(224,64,47,.2),transparent 70%),radial-gradient(55% 70% at 108% 40%,rgba(166,220,243,.17),transparent 70%)}
:root[data-theme="todoroki"] h1::after{content:"";display:block;width:64px;height:3px;margin-top:10px;border-radius:2px;background:linear-gradient(90deg,var(--fire) 50%,var(--ice) 50%);box-shadow:-6px 0 10px -2px rgba(224,64,47,.6),6px 0 10px -2px rgba(166,220,243,.6)}
:root[data-theme="todoroki"] .card{background:rgba(20,24,33,.82);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:inset 2px 0 0 rgba(224,64,47,.55),inset -2px 0 0 rgba(166,220,243,.55)}
:root[data-theme="todoroki"] .tab.on{box-shadow:none;background:linear-gradient(90deg,var(--fire) 50%,var(--ice) 50%) top/100% 2px no-repeat}
:root[data-theme="todoroki"] .set.done{background:linear-gradient(90deg,var(--fire) 50%,var(--ice) 50%);background-origin:border-box;border-color:transparent;box-shadow:-4px 0 10px -3px rgba(224,64,47,.6),4px 0 10px -3px rgba(166,220,243,.6)}
:root[data-theme="todoroki"] .set.miss{color:#fff}
:root[data-theme="todoroki"] .btn.primary{background:linear-gradient(90deg,var(--fire) 50%,var(--ice) 50%);background-origin:border-box;border-color:transparent;color:#0B0D12}
:root[data-theme="todoroki"] .btn.danger,:root[data-theme="todoroki"] .trend{color:#FF8A73}
:root[data-theme="todoroki"] #rest{background:#11141B;color:var(--ink);border:1px solid #3A404C;border-left-color:var(--fire);border-right-color:var(--ice);box-shadow:-8px 0 16px -8px rgba(224,64,47,.6),8px 0 16px -8px rgba(166,220,243,.6)}
:root[data-theme="todoroki"] #rest .btn{color:var(--ink);border-color:rgba(242,243,245,.3)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 var(--body);padding-bottom:132px}
h1{font:700 34px/1 var(--head);margin:18px 16px 14px;letter-spacing:.2px}
h2{font:700 22px/1 var(--head);margin:22px 16px 10px}
main{max-width:560px;margin:0 auto}
main>.card:first-child,main>.empty:first-child{margin-top:16px} /* tabs without a page title */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:0 12px 12px;padding:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted);font-size:14px}
.name{font:700 22px/1.1 var(--head)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--miss)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.btn.wide{width:100%}
.btns{display:flex;gap:8px;margin:0 12px 12px}
.btns .btn{flex:1}
.wrow{display:flex;align-items:center;gap:8px;margin:10px 0 2px}
.wrow input[type=number]{flex:1;min-width:0;width:auto;min-height:44px;text-align:center;font:700 40px/1 var(--head);border:0;background:transparent;padding:0;font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
.wrow input::-webkit-inner-spin-button,.wrow input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.wrow input:focus-visible,.btn:focus-visible,.set:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.step{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--soft);font-size:22px;line-height:1}
.unit{color:var(--muted);font-weight:600}
.plates{min-height:20px;margin-bottom:10px}
.trend{font-size:13px;color:var(--miss);margin-top:-2px}
.pr{font-weight:700;margin-top:4px}
.stats{margin-top:8px}
.hrow input.mini{width:52px;min-height:36px;padding:4px;text-align:center}
.hrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:4px 0}
.hrow b{flex:1 1 100%;font-weight:600}
.sets{display:flex;flex-wrap:wrap;gap:10px}
.set{width:56px;height:56px;border-radius:50%;border:2px solid var(--line);background:transparent;font:700 24px/1 var(--head);color:var(--muted)}
.set.done{background:var(--ok);border-color:var(--ok);color:var(--ok-ink,#fff)}
.set.miss{background:var(--miss);border-color:var(--miss);color:#fff}
.warm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.wset{display:inline-flex;flex-direction:column;align-items:flex-start;justify-content:center;min-height:44px;padding:5px 10px;border:1px solid var(--line);border-radius:10px;background:transparent;font:600 15px/1.15 var(--body);font-variant-numeric:tabular-nums}
.wset span{font-size:12px;font-weight:500;color:var(--muted)}
.wset.done{background:var(--ok);border-color:var(--ok);color:var(--ok-ink,#fff)}
.wset.done span{color:inherit;opacity:.85}
.wset:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tab{flex:1;border:0;background:transparent;padding:14px 4px;font:700 17px/1 var(--head);color:var(--muted)}
.tab.on{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
#rest{position:fixed;left:12px;right:12px;bottom:calc(52px + env(safe-area-inset-bottom,0px) + 8px);z-index:6;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 8px 8px 16px;max-width:536px;margin:0 auto}
#rest[hidden]{display:none}
#rt{font:700 30px/1 var(--head);flex:1;font-variant-numeric:tabular-nums}
#rest .btn{background:transparent;color:var(--bg);border-color:rgba(128,128,128,.5)}
.toast{margin:12px;padding:12px 14px;border-radius:12px;background:var(--soft);border-left:4px solid var(--ok)}
.field{display:grid;grid-template-columns:120px 1fr;gap:8px;align-items:center;margin:8px 0}
.field label{color:var(--muted);font-size:14px}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;min-height:40px}
textarea{min-height:120px;font:13px/1.4 ui-monospace,Menlo,monospace}
textarea.note{min-height:72px;font:500 16px/1.4 var(--body);resize:vertical}
.snote{white-space:pre-wrap;margin-top:4px}
.li{display:flex;align-items:center;gap:6px;padding:6px 0;border-top:1px solid var(--line)}
.li:first-of-type{border-top:0}
.li span{flex:1}
.chart{width:100%;height:auto;display:block}
.sess+.sess{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.line{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-variant-numeric:tabular-nums}
.empty{margin:30px 20px;text-align:center;color:var(--muted)}
/* a background image picked in Settings (per theme, stored on the phone), dimmed toward the theme's own background */
#bgimg{position:fixed;inset:0;pointer-events:none;display:none}
#bgimg{z-index:-2;background:var(--bg-img) center/cover no-repeat}
#bgimg::after{content:"";position:absolute;inset:0;background:var(--bg);opacity:var(--bg-dim,.55)}
:root[data-bgimg] #bgimg{display:block}
input[type=range]{width:100%;accent-color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.set{transition:background .12s,border-color .12s}
  /* Sukuna: a quick slash across a set as you complete it */
  :root[data-theme="sukuna"] .set.fresh{position:relative;overflow:hidden}
  :root[data-theme="sukuna"] .set.fresh::after{content:"";position:absolute;left:-15%;top:calc(50% - 1.5px);width:130%;height:3px;background:#F7F0E6;box-shadow:0 0 6px #F7F0E6;transform:rotate(-38deg);clip-path:inset(0 100% 0 0);animation:slash .32s ease-out forwards}
  @keyframes slash{60%{clip-path:inset(0 0 0 0);opacity:1}100%{clip-path:inset(0 0 0 0);opacity:0}}
  /* Gojo: a blue ring pulses out from a set as you complete it */
  :root[data-theme="gojo"] .set.fresh{position:relative}
  :root[data-theme="gojo"] .set.fresh::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid #9BE3FF;box-shadow:0 0 10px #5CC8FF;pointer-events:none;animation:pulse .5s ease-out forwards}
  @keyframes pulse{from{transform:scale(1);opacity:.95}to{transform:scale(1.75);opacity:0}}
  /* Itachi: three tomoe spin once around a set as you complete it */
  :root[data-theme="itachi"] .set.fresh{position:relative}
  :root[data-theme="itachi"] .set.fresh::after{content:"";position:absolute;inset:-2px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle at 50% 16%,#0B0B0E 3.2px,transparent 3.7px),radial-gradient(circle at 22% 66%,#0B0B0E 3.2px,transparent 3.7px),radial-gradient(circle at 78% 66%,#0B0B0E 3.2px,transparent 3.7px);
    animation:tomoe .7s cubic-bezier(.3,.6,.3,1) forwards}
  @keyframes tomoe{0%{transform:rotate(-120deg);opacity:0}25%{opacity:1}75%{opacity:1}100%{transform:rotate(240deg);opacity:0}}
  /* Ultra Instinct: silver afterimages slip sideways off a set as you complete it */
  :root[data-theme="ultra"] .set.fresh{position:relative}
  :root[data-theme="ultra"] .set.fresh::before,:root[data-theme="ultra"] .set.fresh::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid rgba(240,242,248,.9);background:rgba(220,225,240,.22);pointer-events:none;opacity:0;animation:afterimage .45s ease-out forwards}
  :root[data-theme="ultra"] .set.fresh::before{animation-delay:.07s}
  @keyframes afterimage{0%{transform:translateX(0);opacity:.85}100%{transform:translateX(26px);opacity:0}}
  /* Todoroki: a ring bursts out of a set as you complete it, flame on the left half, ice on the right */
  :root[data-theme="todoroki"] .set.fresh{position:relative}
  :root[data-theme="todoroki"] .set.fresh::before,:root[data-theme="todoroki"] .set.fresh::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:3px solid var(--fire);box-shadow:0 0 10px var(--fire);pointer-events:none;animation:burst .5s ease-out forwards}
  :root[data-theme="todoroki"] .set.fresh::before{clip-path:inset(-20px 50% -20px -20px)}
  :root[data-theme="todoroki"] .set.fresh::after{border-color:var(--ice);box-shadow:0 0 10px var(--ice);clip-path:inset(-20px -20px -20px 50%)}
  @keyframes burst{from{transform:scale(1);opacity:.95}to{transform:scale(1.7);opacity:0}}
}
</style>
</head>
<body>
<div id="bgimg" aria-hidden="true"></div>
<input type="file" accept="image/*" data-f="bgfile" id="bgfile" hidden><!-- outside #view so a re-render while the picker is open can't drop the file -->
<main id="view"></main>
<div id="rest" hidden><span id="rt"></span><button class="btn sm" data-a="r30">+30s</button><button class="btn sm" data-a="rskip">Dismiss</button></div>
<nav class="tabs">
  <button class="tab" data-a="tab" data-tab="today">Today</button>
  <button class="tab" data-a="tab" data-tab="hist">History</button>
  <button class="tab" data-a="tab" data-tab="plan">Plan</button>
  <button class="tab" data-a="tab" data-tab="data">Settings</button>
</nav>
<script>
(function(){
const KEY='lift.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fw=w=>parseFloat((+w).toFixed(2));
const rnd=(w,s)=>Math.round(w/(s||2.5))*(s||2.5);
const uid=()=>Math.random().toString(36).slice(2,9);
const fmtDate=d=>new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const fmtClock=ms=>{const t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0');};
const fmtMin=ms=>{const m=Math.round(ms/60000);return m>=60?Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min':m+' min';};

function defaults(){
  const lin=(id,name,sets,reps,start,inc,bar)=>({id,name,rule:'linear',sets,reps,steps:[8,10,12],inc,start,bar,stage0:0});
  return {v:1,
    ex:[
      Object.assign(lin('squat','Squat',3,5,185,5,45),{rule:'hold'}),
      lin('bench','Bench press',5,5,180,5,45),
      lin('row','Pendlay row',5,5,45,5,45),
      lin('ohp','Overhead press',5,5,45,5,45),
      lin('dl','Deadlift',5,5,45,10,45),
      {id:'curl',name:'EZ-bar curl',rule:'double',sets:3,reps:12,steps:[8,10,12],inc:5,start:65,bar:0,stage0:2},
      {id:'hammer',name:'Hammer curl (each)',rule:'double',sets:3,reps:12,steps:[8,10,12],inc:5,start:30,bar:0,stage0:2}
    ],
    templates:[
      {id:'A',name:'Workout A',ex:['squat','bench','row']},
      {id:'B',name:'Workout B',ex:['squat','ohp','dl']},
      {id:'C',name:'Workout C',ex:['curl','hammer']}
    ],
    sessions:[],active:null,
    settings:{rest:120,plates:[45,35,25,10,5,2.5]}
  };
}
let S;
try{ const raw=localStorage.getItem(KEY); S=raw?JSON.parse(raw):defaults(); }catch(e){ S=defaults(); }
if(!S||!S.ex||!S.templates||!S.sessions){ S=defaults(); }
S.settings=Object.assign({rest:120,plates:[45,35,25,10,5,2.5]},S.settings||{});
// heading fonts only some themes use, loaded when picked
const THEME_FONT={sukuna:'Shippori+Mincho+B1:wght@700;800',gojo:'Zen+Kaku+Gothic+New:wght@700;900',itachi:'Kaisei+Tokumin:wght@700',ultra:'Chakra+Petch:wght@600;700',todoroki:'Kanit:wght@600;700'};
const THEMES=['light','dark','sukuna','gojo','itachi','ultra','todoroki'];
const THEME_NAMES={'':'Match device',light:'Light',dark:'Dark',sukuna:'Sukuna',gojo:'Gojo',itachi:'Itachi',ultra:'Ultra Instinct',todoroki:'Todoroki'};
const applyTheme=()=>{
  if(S.settings.theme&&!THEMES.includes(S.settings.theme)) S.settings.theme=''; // a theme that was removed: back to matching the device
  const t=S.settings.theme, root=document.documentElement;
  if(t) root.setAttribute('data-theme',t); else root.removeAttribute('data-theme');
  delete S.settings.anim; // animated variants were removed
  applyBg();
  if(THEME_FONT[t]&&!$('#font-'+t)){ const l=document.createElement('link'); l.id='font-'+t; l.rel='stylesheet'; l.href='https://fonts.googleapis.com/css2?family='+THEME_FONT[t]+'&display=swap'; document.head.appendChild(l); }
  // match the phone's status bar to the chosen theme
  const bg=t&&getComputedStyle(root).getPropertyValue('--bg').trim();
  document.querySelectorAll('meta[name=theme-color]').forEach(m=>{ if(!m.dataset.c) m.dataset.c=m.content; m.content=bg||m.dataset.c; });
};
/* ---- background images: one per theme, kept in IndexedDB on this phone (too big for localStorage or backups) ---- */
const bgStore=(()=>{
  let dbp;
  const db=()=>dbp||(dbp=new Promise((res,rej)=>{ const r=indexedDB.open('lift',1); r.onupgradeneeded=()=>r.result.createObjectStore('bg'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }));
  const run=(mode,fn)=>db().then(d=>new Promise((res,rej)=>{ const t=d.transaction('bg',mode), q=fn(t.objectStore('bg')); t.oncomplete=()=>res(q.result); t.onerror=()=>rej(t.error); }));
  return {get:k=>run('readonly',s=>s.get(k)), set:(k,v)=>run('readwrite',s=>s.put(v,k)), del:k=>run('readwrite',s=>s.delete(k))};
})();
const bgKey=()=>S.settings.theme||'device';
const bgDim=()=>{ const d=(S.settings.bgDim||{})[bgKey()]; return d==null?.55:d; };
let bgUrl='', bgInfo=null;
function applyBg(){
  const root=document.documentElement, key=bgKey();
  root.style.setProperty('--bg-dim',bgDim());
  bgStore.get(key).then(blob=>{
    if(key!==bgKey()) return; // theme changed meanwhile
    if(bgUrl) URL.revokeObjectURL(bgUrl);
    bgUrl=blob?URL.createObjectURL(blob):''; bgInfo=blob?{type:blob.type,size:blob.size}:null;
    if(blob) root.style.setProperty('--bg-img',`url("${bgUrl}")`);
    root.toggleAttribute('data-bgimg',!!blob);
    if(typeof ui!=='undefined'&&ui.tab==='data') render();
  }).catch(()=>{});
}
applyTheme();
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
// ask the browser not to clear our data when the phone is low on space
try{ navigator.storage.persisted().then(p=>p||navigator.storage.persist()).catch(()=>{}); }catch(e){}
/* ---- check a backup before it replaces everything: a malformed one would be saved and then crash every render,
   so the app wouldn't open again. Returns what's wrong, or '' if it's fine. ---- */
const isNum=x=>typeof x==='number'&&isFinite(x), isAmt=x=>isNum(x)&&x>=0, isCount=x=>Number.isInteger(x)&&x>=0;
const isStr=x=>typeof x==='string', isObj=x=>!!x&&typeof x==='object'&&!Array.isArray(x);
// a logged exercise, in a saved workout or the one in progress
function entryProblem(e){
  if(!isObj(e)) return 'is not an object';
  if(!isStr(e.exId)||!isStr(e.name)) return 'has no exercise id or name';
  if(!isAmt(e.weight)) return 'has an invalid weight';
  if(!isCount(e.nSets)||!isAmt(e.reps)) return 'has an invalid set or rep count';
  if(!Array.isArray(e.sets)||!e.sets.every(r=>r==null||isCount(r))) return 'has invalid set results';
  if(e.wd!=null&&!Array.isArray(e.wd)) return 'has invalid warm-ups';
  return '';
}
function backupProblem(o){
  if(!isObj(o)||!Array.isArray(o.ex)||!Array.isArray(o.templates)||!Array.isArray(o.sessions)) return 'it has no exercises, templates or workouts';
  const named=(what,i,x)=>what+' '+(i+1)+(isObj(x)&&isStr(x.name)?' ('+x.name+')':'');
  for(const [i,x] of o.ex.entries()){
    const p=!isObj(x)?'is not an object':!isStr(x.id)||!isStr(x.name)||!isStr(x.rule)?'has no id, name or progression'
      :!isCount(x.sets)?'needs a whole number of sets':![x.reps,x.inc,x.start,x.bar].every(isAmt)?'has an invalid reps, increment, start or bar weight'
      :!Array.isArray(x.steps)||!x.steps.every(isAmt)?'has invalid rep steps':x.stage0!=null&&!isCount(x.stage0)?'has an invalid starting step'
      :x.override!=null&&!isAmt(x.override)?'has an invalid next weight':x.warm!=null&&!isStr(x.warm)?'has an invalid warm-up setting':'';
    if(p) return named('exercise',i,x)+' '+p;
  }
  for(const [i,t] of o.templates.entries())
    if(!isObj(t)||!isStr(t.id)||!isStr(t.name)||!Array.isArray(t.ex)||!t.ex.every(isStr)) return named('workout template',i,t)+' is invalid';
  for(const [i,s] of o.sessions.entries()){
    const p=!isObj(s)?'is not an object':!isStr(s.id)||!isStr(s.name)||!isNum(s.date)?'has no id, name or date'
      :s.dur!=null&&!isAmt(s.dur)?'has an invalid duration':s.note!=null&&!isStr(s.note)?'has an invalid note':!Array.isArray(s.entries)?'has no exercises':'';
    if(p) return named('workout',i,s)+' '+p;
    for(const e of s.entries){ const q=entryProblem(e); if(q) return named('workout',i,s)+': '+(isObj(e)&&isStr(e.name)?e.name:'an exercise')+' '+q; }
  }
  const a=o.active;
  if(a!=null){
    if(!isObj(a)||!isNum(a.start)||!Array.isArray(a.entries)||(a.note!=null&&!isStr(a.note))) return 'the workout in progress is invalid';
    if(a.rest!=null&&!(isObj(a.rest)&&isNum(a.rest.start)&&isNum(a.rest.end))) return 'the rest timer is invalid';
    for(const e of a.entries){ const q=entryProblem(e); if(q) return 'the workout in progress: '+(isObj(e)&&isStr(e.name)?e.name:'an exercise')+' '+q; }
  }
  const st=o.settings;
  if(st!=null){
    if(!isObj(st)) return 'its settings are invalid';
    if(st.plates!=null&&!(Array.isArray(st.plates)&&st.plates.every(x=>isNum(x)&&x>0))) return 'its plate list is invalid';
    if((st.rest!=null&&!isAmt(st.rest))||(st.restFail!=null&&!isAmt(st.restFail))) return 'its rest times are invalid';
  }
  return '';
}
function applyBackup(o){ S=o; S.settings=Object.assign({rest:120,plates:[45,35,25,10,5,2.5]},S.settings||{}); applyTheme(); }

/* ---- save a backup file (share sheet on phones, download elsewhere) ---- */
function shareBackup(){
  const name='lift-backup-'+new Date().toISOString().slice(0,10)+'.json', json=JSON.stringify(S);
  try{ const f=new File([json],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){ navigator.share({files:[f],title:'Lift backup'}).catch(()=>{}); return; } }catch(e){}
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([json],{type:'application/json'})); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),10000);
}

/* ---- automatic backup to a private GitHub Gist ----
   Token and gist id live under their own key so they never end up in exports or in the gist itself.
   armed: false until this phone's data is allowed to overwrite the gist (stops a fresh install
   wiping a backup before you restore it). */
const GKEY='lift.gist', GFILE='lift-backup.json';
let G={token:'',id:'',armed:false,last:0,err:'',hash:'',found:''};
try{ G=Object.assign(G,JSON.parse(localStorage.getItem(GKEY))||{}); }catch(e){}
const saveG=()=>{ try{ localStorage.setItem(GKEY,JSON.stringify(G)); }catch(e){} };
const backupJson=()=>JSON.stringify(Object.assign({},S,{active:null}),null,1); // skip the in-progress workout
const hashStr=t=>{ let h=5381; for(let i=0;i<t.length;i++) h=(h*33^t.charCodeAt(i))|0; return t.length+':'+h; };
let gBusy='', gAgain=false;
async function gh(path,opts){
  const r=await fetch('https://api.github.com'+path,Object.assign({cache:'no-store'},opts,{headers:{Authorization:'Bearer '+G.token,Accept:'application/vnd.github+json','Content-Type':'application/json'}}));
  if(!r.ok){ const e=new Error(r.status===401?'GitHub rejected the token (expired or mistyped?)':r.status===403||r.status===404?'the token may be missing the gist scope':'GitHub error '+r.status); e.status=r.status; throw e; }
  return r.json();
}
async function findGist(){
  for(let page=1;page<=10;page++){
    const list=await gh('/gists?per_page=100&page='+page), g=list.find(x=>x.files&&x.files[GFILE]);
    if(g) return g; if(list.length<100) break;
  }
  return null;
}
const ago=t=>{ const m=Math.round((Date.now()-t)/60000); return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':fmtDate(t); };
function gistStatus(){
  if(!G.token) return '';
  if(gBusy) return gBusy;
  if(!G.armed) return G.err?'Could not connect: '+G.err+'.':G.found?'Found an existing backup from '+fmtDate(G.found)+'. Restore it, or tap Back up now to replace it with this phone’s data.':'Not connected.';
  if(G.err) return 'Last backup failed: '+G.err+'. It will retry automatically.';
  return G.last?'Backed up '+ago(G.last)+'.':'Not backed up yet.';
}
const gistUI=()=>document.querySelectorAll('.gstat').forEach(el=>el.textContent=gistStatus());
async function gistRun(label,fn){
  if(gBusy){ gAgain=true; return; }
  gBusy=label; gistUI();
  try{ await fn(); G.err=''; }catch(e){ G.err=e.message||'network error'; }
  gBusy=''; saveG(); gistUI();
  if(gAgain){ gAgain=false; syncGist(); }
}
// force: back up even if nothing changed since last time
function syncGist(force){
  if(!G.token||!G.armed) return;
  const json=backupJson(), h=hashStr(json);
  if(!force&&h===G.hash&&!G.err) return;
  if(!navigator.onLine){ G.err='offline'; saveG(); gistUI(); return; }
  return gistRun('Backing up…',async()=>{
    const body={description:'Lift workout backup',files:{[GFILE]:{content:json}}};
    if(!G.id){ const g=await findGist(); if(g) G.id=g.id; }
    if(G.id){ try{ await gh('/gists/'+G.id,{method:'PATCH',body:JSON.stringify(body)}); }catch(e){ if(e.status!==404) throw e; G.id=''; } }
    if(!G.id){ const g=await gh('/gists',{method:'POST',body:JSON.stringify(Object.assign({public:false},body))}); G.id=g.id; }
    G.last=Date.now(); G.hash=h;
  });
}
function connectGist(){
  return gistRun('Connecting…',async()=>{
    const g=await findGist();
    if(g){ G.id=g.id; G.found=g.updated_at; }
    else { G.armed=true; G.err=''; saveG(); setTimeout(()=>syncGist(true)); }
  });
}
function restoreGist(){
  return gistRun('Restoring…',async()=>{
    if(!G.id){ const g=await findGist(); if(!g) throw new Error('no Lift backup found in your gists'); G.id=g.id; }
    const g=await gh('/gists/'+G.id), f=g.files&&g.files[GFILE];
    if(!f) throw new Error('the gist has no '+GFILE);
    const text=f.truncated?await (await fetch(f.raw_url,{cache:'no-store'})).text():f.content;
    const o=JSON.parse(text), bad=backupProblem(o); if(bad) throw new Error('the gist does not hold a valid backup ('+bad+')');
    const active=S.active; applyBackup(o); if(active) S.active=active;
    G.armed=true; G.found=''; G.last=Date.now(); G.hash=hashStr(backupJson()); save();
    ui.toast='Restored your backup from '+fmtDate(g.updated_at)+'.'; ui.tab='today'; render();
  });
}
addEventListener('online',()=>syncGist());
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') syncGist(); });
setTimeout(()=>syncGist(),1500);

const ui={tab:'today',toast:'',confirm:'',openEx:null,chart:null,imp:''};
let VER=('serviceWorker' in navigator)?'checking…':'not installed';
let R=null; // rest timer, kept in S.active.rest so it survives the app being closed
if(S.active&&S.active.rest){ R=S.active.rest; const left=R.end-Date.now(); if(left<=0) R.done=R.warned=true; else if(left<=10000) R.warned=true; }

const getEx=id=>S.ex.find(e=>e.id===id);

/* ---- progression: replay history to get the next target for an exercise ---- */
function nextTarget(ex){
  let w=ex.start,stage=ex.stage0||0,fails=0,deloaded=false;
  for(const s of S.sessions){
    for(const e of s.entries){
      if(e.exId!==ex.id) continue;
      if(e.weight!==w) fails=0; // you changed the weight yourself: failed attempts start over
      w=e.weight; deloaded=false;
      const ok=e.sets.length===e.nSets&&e.sets.every(r=>r!=null&&r>=e.reps);
      if(ex.rule==='linear'){
        if(ok){w+=ex.inc;fails=0;}
        else{fails++; if(fails>=3){w=rnd(w*0.9,2.5);fails=0;deloaded=true;}}
      }else if(ex.rule==='double'){
        if(ok){ if(stage>=ex.steps.length-1){w+=ex.inc;stage=0;}else stage++; fails=0; }
        else fails++;
      }
    }
  }
  if(ex.override!=null) w=ex.override;
  const reps=ex.rule==='double'?(ex.steps[Math.min(stage,ex.steps.length-1)]||ex.reps):ex.reps;
  return {weight:w,stage,reps,sets:ex.sets,fails,deloaded};
}
function trendText(ex,n){
  if(!ex||ex.rule!=='linear'||ex.override!=null) return '';
  if(n.deloaded) return 'Deloaded 10% after 3 missed sessions';
  if(n.fails===1) return '2nd try at this weight';
  if(n.fails===2) return 'Last try before a 10% deload';
  return '';
}

function perSide(total,bar){
  let side=(total-bar)/2; const out=[];
  for(const p of [...S.settings.plates].sort((a,b)=>b-a)){ while(side>=p-1e-9){out.push(p);side-=p;} }
  return {out,short:side>0.01?fw(side):0};
}
function plateText(total,bar){
  if(!bar||total<=bar) return '';
  const {out,short}=perSide(total,bar);
  return 'Per side: '+(out.join(' + ')||'none')+(short?' (short '+short+')':'');
}

/* ---- warm-ups: empty bar x5, then ~40/60/80% of the work weight for 5/3/2 reps.
   Deadlifts skip the empty bar: it sits too low to pull from the floor.
   Light: one set at ~60% x5 (the empty bar if that's lighter), for curls and other accessories. ---- */
const warmMode=ex=>ex.warm||(ex.bar>0?'auto':'off');
function warmups(ex,work){
  const mode=warmMode(ex);
  if(mode==='off'||!(work>0)) return [];
  const bar=ex.bar||0, out=[];
  if(mode==='light'){ const w=Math.max(bar,rnd(work*.6,5)); return w>0&&w<work?[{w,r:5}]:[]; }
  if(bar>0&&work>bar&&!/deadlift/i.test(ex.name||'')) out.push({w:bar,r:5});
  for(const [pct,r] of [[.4,5],[.6,3],[.8,2]]){
    const w=rnd(work*pct,5), last=out[out.length-1];
    if(w>bar&&w<work&&(!last||w>last.w)) out.push({w,r});
  }
  return out;
}
const warmPlates=(w,bar)=>!bar?'':w<=bar?'bar only':perSide(w,bar).out.join('+')+' /side';

/* ---- rest timer ---- */
// miss: use the longer rest; from: keep counting from when the set was first logged
function startRest(miss,from){ const st=from||Date.now(); R={start:st,end:st+(miss?(S.settings.restFail||300):S.settings.rest)*1000,done:false,warned:false}; }
let AC=null;
function unlockAudio(){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){} }
function tone(freq,at,len,vol){
  const o=AC.createOscillator(),g=AC.createGain(); o.type='square'; o.frequency.value=freq;
  g.gain.setValueAtTime(0,at); g.gain.linearRampToValueAtTime(vol,at+.01); g.gain.setValueAtTime(vol,at+len-.03); g.gain.linearRampToValueAtTime(0,at+len);
  o.connect(g); g.connect(AC.destination); o.start(at); o.stop(at+len);
}
// n=1: 10-second warning, n=3: rest is over
function beep(n){
  try{ unlockAudio(); const t=AC.currentTime+.02; for(let i=0;i<n;i++) tone(n>1?1046:784,t+i*.32,.22,.35); }catch(e){}
  try{ navigator.vibrate&&navigator.vibrate(n>1?[300,120,300,120,300]:[120]); }catch(e){}
}
/* keep the screen awake during a workout so the timer can fire */
let WL=null;
async function wake(){
  try{
    const want=S.active&&S.settings.wake!==false&&document.visibilityState==='visible';
    if(want&&!WL&&'wakeLock' in navigator){ WL=await navigator.wakeLock.request('screen'); WL.addEventListener('release',()=>{WL=null;}); }
    else if(!want&&WL){ const w=WL; WL=null; await w.release(); }
  }catch(e){ WL=null; }
}
document.addEventListener('visibilitychange',wake);
function tick(){
  const el=$('#elapsed'); if(el&&S.active) el.textContent=fmtClock(Date.now()-S.active.start);
  const b=$('#rest'); if(!R){b.hidden=true;return;}
  b.hidden=false;
  const left=Math.ceil((R.end-Date.now())/1000);
  if(left<=10&&left>0&&!R.warned){ R.warned=true; beep(1); }
  if(left<=0){ if(!R.done){R.done=true;beep(3);restEnded();} $('#rt').textContent='Go'; }
  else $('#rt').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
}
setInterval(tick,500);

/* ---- rest notifications (Android): "next set at 10:42" while resting, an alert if the rest ends while you're away ---- */
const notifyOn=()=>S.settings.notify&&'Notification' in window&&Notification.permission==='granted';
const restReg=()=>'serviceWorker' in navigator?navigator.serviceWorker.getRegistration():Promise.resolve(null);
function nextSetText(){
  for(const e of (S.active?S.active.entries:[])){ const j=e.sets.indexOf(null); if(j>=0) return 'Next: '+e.name+' \u00b7 set '+(j+1); }
  return 'All sets logged';
}
async function restNote(kind){
  try{
    const reg=await restReg(); if(!reg) return;
    if(kind==='clear'||!notifyOn()||!R){ (await reg.getNotifications({tag:'lift-rest'})).forEach(n=>n.close()); return; }
    const at=new Date(R.end).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
    if(kind==='start') await reg.showNotification('Resting \u00b7 next set at '+at,{tag:'lift-rest',body:nextSetText(),icon:'icon-192.png',silent:true});
    else await reg.showNotification('Rest over',{tag:'lift-rest',body:nextSetText(),icon:'icon-192.png',renotify:true,vibrate:[300,120,300,120,300]});
  }catch(e){}
}
let restKey, restTimer=0; // restKey starts undefined so the first sync also clears a leftover notification
// called after every tap: post or clear the notification when the rest changes, and wake up exactly when it ends
function syncRest(){
  const k=R&&!R.done?R.end:null; if(k===restKey) return; restKey=k;
  clearTimeout(restTimer);
  if(k){ restTimer=setTimeout(tick,R.end-Date.now()+50); restNote('start'); } else restNote('clear');
}
function restEnded(){ restKey=null; restNote(document.visibilityState==='hidden'?'end':'clear'); }

/* ---- views ---- */
function vToday(){
  if(S.active) return vActive();
  const last=[...S.sessions].reverse().find(s=>s.tid==='A'||s.tid==='B');
  const nxt=last&&last.tid==='A'?'B':'A';
  let h='';
  if(ui.toast) h+=`<div class="toast">${esc(ui.toast)}${ui.pr?`<div class="pr">${esc(ui.pr)}</div>`:''}${ui.toastSync?'<div class="muted gstat" style="margin-top:4px">'+esc(gistStatus())+'</div>':''}${ui.toastShare?'<button class="btn sm" data-a="share" style="margin-top:8px">Save backup file</button>':''}</div>`;
  h+='<h1>Start workout</h1>';
  for(const t of S.templates){
    const lines=t.ex.map(id=>{const ex=getEx(id); if(!ex) return ''; const n=nextTarget(ex);
      const tr=trendText(ex,n);
      return `<div class="line"><span>${esc(ex.name)}</span><span>${fw(n.weight)} · ${n.sets}×${n.reps}</span></div>${tr?`<div class="trend">${esc(tr)}</div>`:''}`;}).join('');
    h+=`<div class="card"><div class="row"><div class="name">${esc(t.name)}</div>${t.id===nxt?'<span class="muted">Up next</span>':''}</div>

      <button class="btn wide ${t.id===nxt?'primary':''}" data-a="start" data-t="${t.id}">Start ${esc(t.name)}</button></div>`;
  }
  return h;
}
function warmHtml(e,i,ex){
  const ws=warmups(ex,e.weight); if(!ws.length) return '';
  return `<div class="warm"><span class="muted">Warm-up</span>${ws.map((w,k)=>`<button class="wset ${e.wd&&e.wd[k]?'done':''}" data-a="wset" data-e="${i}" data-k="${k}" aria-label="Warm-up ${fw(w.w)} for ${w.r}">${fw(w.w)}×${w.r}${ex.bar?`<span>${esc(warmPlates(w.w,ex.bar))}</span>`:''}</button>`).join('')}</div>`;
}

  a.entries.forEach((e,i)=>{
    const real=getEx(e.exId), ex=real||{inc:5,bar:0}, tr=real?trendText(real,nextTarget(real)):'';
    const circles=e.sets.map((v,j)=>`<button class="set ${v==null?'':(v>=e.reps?'done':'miss')}${ui.fresh===i+'-'+j?' fresh':''}" data-a="set" data-e="${i}" data-s="${j}" aria-label="Set ${j+1}">${v==null?e.reps:v}</button>`).join('');
    h+=`<div class="card"><div class="row"><div class="name">${esc(e.name)}</div><span class="muted">${e.nSets}×${e.reps}</span></div>${tr?`<div class="trend">${esc(tr)}</div>`:''}
      <div class="wrow"><button class="step" data-a="w" data-e="${i}" data-d="-1" aria-label="Decrease weight">−</button>

      <div class="plates muted">${esc(plateText(e.weight,ex.bar))}</div>${warmHtml(e,i,ex)}<div class="sets">${circles}</div></div>`;

      <textarea id="note" class="note" placeholder="How did it go?">${esc(a.note||'')}</textarea></div>`;
  h+=`<div class="btns"><button class="btn danger" data-a="discard">${ui.confirm==='discard'?'Tap again to discard':'Discard'}</button>
      <button class="btn primary" data-a="finish">Finish workout</button></div>`;
  return h;
}
function loggedWeights(exId){
  const pts=[]; for(const s of S.sessions) for(const e of s.entries) if(e.exId===exId) pts.push({d:s.date,w:e.weight});
  return pts;
}
function chartSvg(pts){
  if(pts.length<2) return '<div class="muted" style="padding:8px 0">Log this lift in two or more sessions to see a chart.</div>';
  const W=320,H=120,p=14, ws=pts.map(x=>x.w), lo=Math.min(...ws), hi=Math.max(...ws), span=(hi-lo)||1;
  const X=i=>p+i*(W-2*p)/(pts.length-1), Y=w=>H-p-(w-lo)*(H-2*p)/span;
  const d=pts.map((q,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(q.w).toFixed(1)).join(' ');
  const dots=pts.map((q,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(q.w).toFixed(1)}" r="3" fill="var(--accent)"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight over time"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${dots}
    <text x="${p}" y="11" fill="var(--muted)" font-size="11">${fw(hi)} lb</text><text x="${p}" y="${H-2}" fill="var(--muted)" font-size="11">${fw(lo)} lb</text></svg>`;
}
const e1rm=(w,r)=>r>0?(r===1?w:w*(1+r/30)):0; // Epley estimate
function entryBest(e){ return {heavy:e.sets.some(v=>v>0)?e.weight:0, e1:Math.max(0,...e.sets.map(v=>e1rm(e.weight,v||0)))}; }
function bests(exId){
  const b={heavy:0,e1:0,n:0};
  for(const s of S.sessions) for(const e of s.entries) if(e.exId===exId){ const x=entryBest(e); b.heavy=Math.max(b.heavy,x.heavy); b.e1=Math.max(b.e1,x.e1); b.n++; }
  return b;
}
function vHist(){
  let h='';
  const withData=S.ex.filter(e=>loggedWeights(e.id).length);
  if(withData.length){
    if(!withData.find(e=>e.id===ui.chart)) ui.chart=withData[0].id;
    h+=`<div class="card"><select data-f="chart">${withData.map(e=>`<option value="${e.id}" ${e.id===ui.chart?'selected':''}>${esc(e.name)}</option>`).join('')}</select>${chartSvg(loggedWeights(ui.chart))}${(b=>`<div class="muted stats">Heaviest: <b>${fw(b.heavy)} lb</b> · Best est. 1RM: <b>${Math.round(b.e1)} lb</b></div>`)(bests(ui.chart))}</div>`;
  }
  if(!S.sessions.length) return h+'<div class="empty">No workouts yet. Finish one and it shows up here.</div>';
  h+='<div class="card">';
  for(const s of [...S.sessions].reverse()){
    h+=`<div class="sess"><div class="row"><div class="name">${esc(s.name)}</div><span class="muted">${fmtDate(s.date)}${s.dur?' · '+fmtMin(s.dur):''}</span></div>`;
    if(ui.editSess===s.id){
      s.entries.forEach((e,i)=>{ h+=`<div class="hrow"><b>${esc(e.name)}</b><input class="mini" type="number" inputmode="decimal" step="any" value="${fw(e.weight)}" data-f="hw" data-sid="${s.id}" data-e="${i}" aria-label="${esc(e.name)} weight"><span class="unit">lb</span><span class="muted">reps</span>
        ${e.sets.map((v,j)=>`<input class="mini" type="number" inputmode="numeric" min="0" value="${v==null?'':v}" placeholder="–" data-f="hset" data-sid="${s.id}" data-e="${i}" data-s="${j}" aria-label="Set ${j+1} reps">`).join('')}</div>`; });
      h+=`<textarea class="note" data-hnote="${s.id}" placeholder="Notes" style="margin-top:6px">${esc(s.note||'')}</textarea>`;
      h+=`<div style="margin-top:6px;display:flex;gap:8px"><button class="btn sm primary" data-a="hdone">Done</button>`;
    }else{
      for(const e of s.entries) h+=`<div class="line"><span>${esc(e.name)} ${fw(e.weight)}</span><span>${e.sets.map(v=>v==null?'–':v).join(' ')}</span></div>`;
      if(s.note) h+=`<div class="muted snote">${esc(s.note)}</div>`;
      h+=`<div style="margin-top:6px;display:flex;gap:8px"><button class="btn sm" data-a="hedit" data-id="${s.id}">Edit</button>`;
    }
    h+=`<button class="btn sm danger" data-a="delsess" data-id="${s.id}">${ui.confirm===s.id?'Tap again to delete':'Delete'}</button></div></div>`;
  }
  return h+'</div>';
}
function vPlan(){
  let h='';
  for(const t of S.templates){
    h+=`<div class="card"><div class="name" style="margin-bottom:6px">${esc(t.name)}</div>`;
    t.ex.forEach((id,i)=>{ const ex=getEx(id);
      h+=`<div class="li"><span>${esc(ex?ex.name:'Removed exercise')}</span>

    if(open){
      const f=(label,k,val,type)=>`<div class="field"><label>${label}</label><input type="${type||'number'}" ${type==='text'?'':'inputmode="decimal" step="any"'} value="${esc(val)}" data-f="ex" data-id="${ex.id}" data-k="${k}"></div>`;
      h+=f('Name','name',ex.name,'text');
      h+=`<div class="field"><label>Progression</label><select data-f="ex" data-id="${ex.id}" data-k="rule">
        ${[['linear','Linear: add weight when all sets hit'],['double','Double: climb reps, then add weight'],['hold','Hold: keep weight fixed']].map(([v,l])=>`<option value="${v}" ${ex.rule===v?'selected':''}>${l}</option>`).join('')}</select></div>`;
      h+=f('Sets','sets',ex.sets);
      h+= ex.rule==='double'?f('Rep steps','steps',ex.steps.join(','),'text'):f('Reps','reps',ex.reps);
      h+=f('Increment (lb)','inc',ex.inc);

      h+=`<div class="field"><label>Warm-up sets</label><select data-f="ex" data-id="${ex.id}" data-k="warm">
        <option value="auto" ${warmMode(ex)==='auto'?'selected':''}>Auto (bar, then 40/60/80%)</option><option value="light" ${warmMode(ex)==='light'?'selected':''}>One light set (60% ×5)</option><option value="off" ${warmMode(ex)==='off'?'selected':''}>Off</option></select></div>`;
      h+=f('Next weight','override',fw(n.weight));
      h+=`<button class="btn sm danger" data-a="exdel" data-id="${ex.id}" style="margin-top:6px">${ui.confirm==='ex'+ex.id?'Tap again to delete':'Delete exercise'}</button>`;
    }
    h+='</div>';
  }
  h+='<div class="btns"><button class="btn" data-a="exnew">New exercise</button></div>';
  return h;
}

/* ---- actions ---- */
function swap(arr,i,j){ if(j<0||j>=arr.length) return; [arr[i],arr[j]]=[arr[j],arr[i]]; }
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-a]'); if(!el) return;
  unlockAudio();
  const imp=$('#imp'); if(imp) ui.imp=imp.value; // re-render below would wipe the pasted text
  const d=el.dataset, keep=ui.confirm; ui.confirm='';
  switch(d.a){
    case 'tab': ui.tab=d.tab; ui.toast=''; ui.pr=''; ui.editSess=null; ui.toastSync=ui.toastShare=false; ui.impMsg=''; break;
    case 'start': {
      const t=S.templates.find(x=>x.id===d.t); if(!t) break;
      S.active={tid:t.id,start:Date.now(),entries:t.ex.map(id=>{const ex=getEx(id); if(!ex) return null; const n=nextTarget(ex);
        return {exId:id,name:ex.name,weight:n.weight,nSets:n.sets,reps:n.reps,stage:n.stage,sets:Array(n.sets).fill(null)};}).filter(Boolean)};
      ui.toast=''; ui.pr=''; ui.toastSync=ui.toastShare=false; break; }
    case 'hedit': ui.editSess=d.id; break;
    case 'hdone': ui.editSess=null; break;
    case 'wset': {
      const e=S.active.entries[+d.e], k=+d.k, ex=getEx(e.exId); e.wd=e.wd||[]; e.wd[k]=!e.wd[k];
      // ticking off the last warm-up starts the rest before the first work set
      const n=ex?warmups(ex,e.weight).length:0;
      if(e.wd[k]&&n&&e.wd.slice(0,n).filter(Boolean).length===n) startRest(false);
      break; }
    case 'set': {
      const e=S.active.entries[+d.e], j=+d.s, cur=e.sets[j];
      const nv=cur==null?e.reps:(cur>0?cur-1:null); e.sets[j]=nv;
      if(cur==null){ startRest(false); ui.fresh=d.e+'-'+j; } // lets a theme animate the set just completed
      else if(cur>=e.reps&&nv!=null&&nv<e.reps) startRest(true,R&&R.start); // set just became a miss
      break; }
    case 'w': { const e=S.active.entries[+d.e], ex=getEx(e.exId); e.weight=Math.max(0,fw(e.weight+(+d.d)*(ex?ex.inc:5))); break; }
    case 'r30': if(R){R.end=Math.max(R.end,Date.now())+30000;R.done=false;R.warned=false;} break;
    case 'rskip': R=null; break;
    case 'discard':
      if(keep==='discard'){ S.active=null; R=null; } else ui.confirm='discard'; break;
    case 'finish': {
      const a=S.active, t=S.templates.find(x=>x.id===a.tid);
      const entries=a.entries.filter(e=>e.sets.some(v=>v!=null));
      entries.forEach(e=>delete e.wd); // warm-ups aren't part of the log
      if(entries.length){
        const dur=Date.now()-a.start;
        const prs=[];
        for(const e of entries){ const prev=bests(e.exId), cur=entryBest(e); if(!prev.n) continue;
          if(cur.heavy>prev.heavy) prs.push(e.name+' '+fw(cur.heavy)+' lb');
          else if(cur.e1>prev.e1+0.5) prs.push(e.name+' est. 1RM '+Math.round(cur.e1)+' lb'); }
        ui.pr=prs.length?'New PR: '+prs.join(', '):'';
        const sess={id:uid(),date:Date.now(),start:a.start,dur,tid:a.tid,name:t?t.name:'Workout',entries};
        if((a.note||'').trim()) sess.note=a.note.trim();
        S.sessions.push(sess);
        entries.forEach(e=>{const ex=getEx(e.exId); if(ex) delete ex.override;});
        ui.toast='Saved '+(t?t.name:'workout')+' ('+fmtMin(dur)+'). Targets are updated for next time.';
        if(G.token&&G.armed){ ui.toastSync=true; S.active=null; save(); syncGist(); } else ui.toastShare=true;
      }else ui.toast='Nothing was logged, so nothing was saved.';
      S.active=null; R=null; break; }
    case 'delsess':
      if(keep===d.id) S.sessions=S.sessions.filter(s=>s.id!==d.id); else ui.confirm=d.id; break;
    case 'tup': swap(S.templates.find(t=>t.id===d.t).ex,+d.i,+d.i-1); break;
    case 'tdn': swap(S.templates.find(t=>t.id===d.t).ex,+d.i,+d.i+1); break;
    case 'trm': S.templates.find(t=>t.id===d.t).ex.splice(+d.i,1); break;
    case 'exopen': ui.openEx=ui.openEx===d.id?null:d.id; break;
    case 'exnew': { const id=uid(); S.ex.push({id,name:'New exercise',rule:'linear',sets:3,reps:8,steps:[8,10,12],inc:5,start:45,bar:0,stage0:0}); ui.openEx=id; break; }
    case 'exdel':
      if(keep==='ex'+d.id){ S.ex=S.ex.filter(e=>e.id!==d.id); S.templates.forEach(t=>t.ex=t.ex.filter(i=>i!==d.id)); ui.openEx=null; } else ui.confirm='ex'+d.id; break;
    case 'copy': { const ta=$('#exp'); try{ navigator.clipboard.writeText(ta.value).catch(()=>{ta.select();}); }catch(e){ ta.select(); } ta.select(); return; }
    case 'import':
      if(keep==='import'){
        let o=null; try{ o=JSON.parse($('#imp').value); }catch(e){}
        const bad=o==null?'it isn’t backup text':backupProblem(o);
        // a rejection stays here with the pasted text, so it shows even mid-workout (Today hides toasts then)
        if(bad) ui.impMsg='That is not a valid backup: '+bad+'. Nothing was changed.';
        else { applyBackup(o); ui.toast='Backup imported.'; ui.tab='today'; ui.imp=''; ui.impMsg=''; }
      } else ui.confirm='import';
      break;
    case 'share': shareBackup(); return;
    case 'bgpick': $('#bgfile').click(); return;
    case 'bgdel': bgStore.del(bgKey()).then(applyBg); return;
    case 'gsync': G.armed=true; G.found=''; saveG(); syncGist(true); break;
    case 'grestore': if(keep==='grestore'){ restoreGist(); return; } ui.confirm='grestore'; break;
    case 'gdisc': if(keep==='gdisc'){ G={token:'',id:'',armed:false,last:0,err:'',hash:'',found:''}; saveG(); } else ui.confirm='gdisc'; break;
  }
  if(S.active) S.active.rest=R;
  syncRest(); save(); render();
});
// workout note: save as you type, without re-rendering (a re-render on blur would swallow the Finish tap)
document.addEventListener('input',ev=>{
  if(ev.target.dataset.f==='bgdim') document.documentElement.style.setProperty('--bg-dim',ev.target.value);
  if(ev.target.id==='note'&&S.active){ S.active.note=ev.target.value; save(); }
  const hs=ev.target.dataset.hnote&&S.sessions.find(x=>x.id===ev.target.dataset.hnote);
  if(hs){ if(ev.target.value.trim()) hs.note=ev.target.value; else delete hs.note; save(); }
});
document.addEventListener('change',ev=>{
  const el=ev.target.closest('[data-f]'); if(!el) return;
  const d=el.dataset, v=el.value;
  // editing a past workout: save without re-rendering so the Done tap isn't swallowed
  if(d.f==='hw'||d.f==='hset'){
    const s=S.sessions.find(x=>x.id===d.sid), e=s&&s.entries[+d.e]; if(!e) return;
    if(d.f==='hw'){ const n=parseFloat(v); if(!isNaN(n)&&n>=0) e.weight=n; }
    else { const n=parseInt(v,10); e.sets[+d.s]=v===''?null:(n>=0?n:e.sets[+d.s]); }
    save(); return;
  }
  switch(d.f){
    case 'w': { const n=parseFloat(v); if(!isNaN(n)&&n>=0) S.active.entries[+d.e].weight=n; break; }
    case 'chart': ui.chart=v; break;
    case 'wake': S.settings.wake=v==='1'; break;
    case 'notify':
      ui.notifyMsg='';
      if(v!=='1'){ S.settings.notify=false; restNote('clear'); break; }
      if(!('Notification' in window)){ ui.notifyMsg='This browser can\u2019t show notifications.'; break; }
      Notification.requestPermission().then(r=>{
        S.settings.notify=r==='granted';
        ui.notifyMsg=r==='granted'?'':'Notifications are blocked for Lift. Allow them in Android Settings \u2192 Apps \u2192 Lift \u2192 Notifications.';
        save(); render(); if(r==='granted'&&R&&!R.done){ restKey=null; syncRest(); }
      });
      break;
    case 'tadd': if(v) S.templates.find(t=>t.id===d.t).ex.push(v); break;
    case 'rest': { const n=parseInt(v,10); if(n>0) S.settings.rest=n; break; }
    case 'restFail': { const n=parseInt(v,10); if(n>0) S.settings.restFail=n; break; }
    case 'plates': { const p=v.split(',').map(x=>parseFloat(x)).filter(x=>x>0); if(p.length) S.settings.plates=p; break; }
    case 'theme': S.settings.theme=v; ui.bgMsg=''; applyTheme(); break;
    case 'bgfile': {
      const f=el.files&&el.files[0]; el.value=''; if(!f) return;
      if(!/^image\//.test(f.type)){ ui.bgMsg='That file isn\u2019t an image.'; break; }
      if(f.size>25e6){ ui.bgMsg='That image is over 25 MB; pick a smaller one.'; break; }
      ui.bgMsg=''; bgStore.set(bgKey(),f).then(applyBg).catch(()=>{ ui.bgMsg='Couldn\u2019t save the image (phone storage full?).'; render(); });
      return; }
    case 'bgdim': S.settings.bgDim=Object.assign({},S.settings.bgDim,{[bgKey()]:+v}); document.documentElement.style.setProperty('--bg-dim',v); break;
    case 'gtoken': if(v.trim()){ G.token=v.trim(); G.id=''; G.armed=false; G.err=''; G.found=''; saveG(); connectGist(); } break;
    case 'ex': {
      const ex=getEx(d.id), k=d.k; if(!ex) break;
      if(k==='name') ex.name=v.trim()||ex.name;
      else if(k==='rule') ex.rule=v;
      else if(k==='warm') ex.warm=v;
      else if(k==='steps'){ const s=v.split(',').map(x=>parseInt(x,10)).filter(x=>x>0); if(s.length) ex.steps=s; }
      else if(k==='override'){ const n=parseFloat(v); if(!isNaN(n)&&n>=0) ex.override=n; }
      else { const n=parseFloat(v); if(!isNaN(n)&&n>=0) ex[k]=n; }
      break; }
  }
  save(); render();
});
window.liftBusy=()=>!!S.active;
syncRest(); // reopened mid-rest: re-arm the end alert
window.setVer=v=>{ VER=v; const el=$('#ver'); if(el) el.textContent=v; };
render();
})();
</script>
<script>
if('serviceWorker' in navigator){
  addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
  // ask the running service worker which version (cache name) it is
  const sw=navigator.serviceWorker, ask=()=>{ if(sw.controller) sw.controller.postMessage('version'); else window.setVer('not installed'); };
  sw.addEventListener('message',e=>{ if(e.data&&e.data.version) window.setVer(e.data.version); });
  // a new version took over: reload to show it, unless mid-workout (would drop the rest timer)
  const hadSW=!!sw.controller;
  sw.addEventListener('controllerchange',()=>{ ask(); if(hadSW&&!window.liftBusy()) location.reload(); });
  ask();
}
</script>
